<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="500" height="500">
  <!-- Ícone do app RLT. Paleta do brandbook Aeroporto de Brasília: Azul 01 #003863, Verde 02 #72BF44. Sem o símbolo oficial da marca. -->
  <defs>
    <linearGradient id="faixa" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9bc53d"/>
      <stop offset="0.45" stop-color="#72BF44"/>
      <stop offset="1" stop-color="#2e9a4c"/>
    </linearGradient>
  </defs>
  <rect width="250" height="250" fill="#003863"/>
  <!-- prancheta -->
  <rect x="70" y="38" width="96" height="120" rx="12" fill="#ffffff"/>
  <rect x="96" y="28" width="44" height="22" rx="7" fill="#72BF44"/>
  <g stroke="#003863" stroke-width="8" stroke-linecap="round">
    <line x1="88" y1="74" x2="148" y2="74"/>
    <line x1="88" y1="96" x2="148" y2="96"/>
    <line x1="88" y1="118" x2="120" y2="118"/>
  </g>
  <!-- selo de passagem de turno (setas de troca) -->
  <circle cx="166" cy="146" r="36" fill="#72BF44" stroke="#003863" stroke-width="8"/>
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M148 136 H182 M172 125 L183 136 L172 147"/>
    <path d="M184 158 H150 M160 147 L149 158 L160 169"/>
  </g>
  <!-- sigla -->
  <text x="125" y="214" text-anchor="middle" font-family="Arial Black, Segoe UI, Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="6" fill="#ffffff">RLT</text>
  <!-- faixa verde do brandbook -->
  <rect y="234" width="250" height="16" fill="url(#faixa)"/>
</svg>
