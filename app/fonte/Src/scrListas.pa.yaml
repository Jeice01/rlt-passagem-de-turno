              {m: If(locAba = "pes" && !IsBlank(Trim(ediT3.Text)) && !IsMatch(Trim(ediT3.Text), Match.Email), "E-mail inválido.", "")},
              {m: If(locAba = "pes" && !IsBlank(Trim(ediT3.Text)) && !IsBlank(LookUp(Pessoas, rlt_email = Lower(Trim(ediT3.Text)))) && (locNovo || LookUp(Pessoas, rlt_email = Lower(Trim(ediT3.Text))).rlt_pessoaid <> locPes.rlt_pessoaid), "Esse e-mail já é de " & LookUp(Pessoas, rlt_email = Lower(Trim(ediT3.Text))).rlt_nome & ".", "")},
