              Control: Classic/Button@2.2.0
              Properties:
                Text: |-
                  =If(!IsBlank(gblRel) && gblRel.rlt_situacao = [@'Situação do relatório'].Aberto, "Editar", "Ver")
                OnSelect: |-
                  =Navigate(scrRegistro, ScreenTransition.None, {locId: ThisItem.rlt_registroid, locSecao: ThisItem.rlt_secao})
