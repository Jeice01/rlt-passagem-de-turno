                RadiusBottomLeft: |-
                  =8
                RadiusBottomRight: |-
                  =8
                Visible: |-
                  =!IsBlank(gblRel) && gblRel.rlt_situacao = [@'Situação do relatório'].Aberto && IsBlank(ThisItem.rlt_conclusao) && !ThisItem.rlt_chamadofalso
