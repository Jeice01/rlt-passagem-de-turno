# Gerado por app/gerar_app.py a partir do protótipo validado. Edite o gerador, não este arquivo.
Screens:
  scrRegistro:
    Properties:
      Fill: |-
        =corFundo
      OnVisible: |-
        =UpdateContext({locReg: If(IsBlank(locId), Blank(), LookUp(Registros, rlt_registroid = locId))});
        UpdateContext({locIni: Coalesce(locReg.rlt_inicio, Now())});
        UpdateContext({locFim: locReg.rlt_conclusao});
        UpdateContext({locNI: If(locReg.rlt_ni, true, false)});
        UpdateContext({locFalso: If(locReg.rlt_chamadofalso, true, false)});
        UpdateContext({locStatus: If(IsBlank(locReg.rlt_status), "EM ANDAMENTO", Text(locReg.rlt_status))});
        UpdateContext({locStatusIos: If(IsBlank(locReg.rlt_statusios), "Em andamento", Text(locReg.rlt_statusios))});
        UpdateContext({locArea: locReg.rlt_local.rlt_area});
        UpdateContext({locErro: ""});
        UpdateContext({locAnexar: false});
        UpdateContext({locFicar: false});
        UpdateContext({locResetar: true});
        UpdateContext({locResetar: false});
        ResetForm(frmAnexo)
