# Gerado por app/gerar_app.py a partir do protótipo validado. Edite o gerador, não este arquivo.
Screens:
  scrAbrir:
    Properties:
      Fill: |-
        =corFundo
      OnVisible: |-
        =UpdateContext({locProxTurno: If(IsBlank(gblRel), If(Hour(Now()) >= 7 && Hour(Now()) < 19, "ALFA", "BRAVO"), If(Text(gblRel.rlt_turno) = "ALFA", "BRAVO", "ALFA"))});
        UpdateContext({locProxData: If(IsBlank(gblRel), If(Hour(Now()) >= 19, DateAdd(Today(), 1, TimeUnit.Days), Today()), If(Text(gblRel.rlt_turno) = "ALFA", DateAdd(gblRel.rlt_data, 1, TimeUnit.Days), gblRel.rlt_data))});
        ClearCollect(colRegs, Filter(Registros, rlt_relatorio.rlt_relatorioid = gblRel.rlt_relatorioid));
        ClearCollect(colEquipe, Filter('Equipe do plantão', rlt_relatorio.rlt_relatorioid = gblRel.rlt_relatorioid && IsBlank(rlt_retiradoem)));
        Reset(abrTurno); Reset(abrData)
