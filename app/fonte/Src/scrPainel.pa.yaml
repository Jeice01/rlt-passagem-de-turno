                  =Filter(Equipamentos, rlt_tipo <> [@'Tipo de equipamento'].Bagagem)
                DisplayFields: |-
                  =["rlt_nome"]
                SearchFields: |-
                  =["rlt_nome", "rlt_codigosap"]
                SelectMultiple: |-
