              Control: Classic/Button@2.2.0
              Properties:
                Text: |-
                  ="Corrigir"
                OnSelect: |-
                  =If(IsBlank(paiCbx.Selected), Notify("Escolha o equipamento na lista.", NotificationType.Warning),
                    Patch(Registros, LookUp(Registros, rlt_registroid = ThisItem.rlt_registroid), {rlt_equipamento: paiCbx.Selected, rlt_equipamentolivre: ""});
