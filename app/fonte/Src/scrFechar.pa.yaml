        Control: Classic/Button@2.2.0
        Properties:
          Text: |-
            ="Fechar e enviar"
          OnSelect: |-
            =Patch(Relatórios, LookUp(Relatórios, rlt_relatorioid = gblRel.rlt_relatorioid), {rlt_situacao: [@'Situação do relatório'].Fechado, rlt_fechadoem: Now(), rlt_fechadopor: gblUsuario});
            Patch(Histórico, Defaults(Histórico), {rlt_campo: "Relatório fechado e enviado", rlt_quando: Now(), rlt_quem: gblUsuario, rlt_relatorio: gblRel, rlt_registro: Blank()});
            Set(gblRel, LookUp(Relatórios, rlt_relatorioid = gblRel.rlt_relatorioid));
            Reset(fecConf);
            Notify("Relatório fechado. O PDF e o e-mail entram com o fluxo Fechar e enviar (próxima etapa).", NotificationType.Success);
            Navigate(scrRelatorio, ScreenTransition.None)
          X: |-
            =Parent.Width - 210
          Y: |-
            =Parent.Height - 70
          Width: |-
            =190
          Height: |-
            =48
          Size: |-
            =12
