            =corAzul
          Color: |-
            =Color.White
          BorderColor: |-
            =corAzul
          BorderThickness: |-
            =1
          HoverFill: |-
            =corAzul80
          HoverColor: |-
            =Color.White
          RadiusTopLeft: |-
            =8
          RadiusTopRight: |-
            =8
          RadiusBottomLeft: |-
            =8
          RadiusBottomRight: |-
            =8
          Visible: |-
            =!IsBlank(gblRel) && gblRel.rlt_situacao = [@'Situação do relatório'].Aberto
          DisplayMode: |-
            =If(fecConf.Value, DisplayMode.Edit, DisplayMode.Disabled)
    - fecFechado:
        Control: Label@2.5.1
        Properties:
          Visible: |-
            =Not(!IsBlank(gblRel) && gblRel.rlt_situacao = [@'Situação do relatório'].Aberto)
          Color: |-
            =corAzul
          Fill: |-
            =corAzul10
          Size: |-
            =12
          PaddingLeft: |-
            =16
          X: |-
            =224
          Y: |-
            =524
          Width: |-
            =Parent.Width - 248
          Height: |-
            =48
          Text: |-
            =If(IsBlank(gblRel), "Nenhum relatório.", "Relatório fechado em " & Text(gblRel.rlt_fechadoem, "dd/mm/yyyy hh:mm") & " por " & Coalesce(gblRel.rlt_fechadopor.rlt_nome, "—") & ". Abra o próximo plantão na tela Relatório.")
