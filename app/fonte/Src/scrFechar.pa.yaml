            =300
          Text: |-
            ="RESUMO" & Char(10) & Char(10) & Concat(tabSecoes, Nome & ": " & CountRows(Filter(colRegs, rlt_secao = Valor)), Char(10)) & Char(10) & Char(10) & "Passam ao próximo turno: " & CountRows(Filter(colRegs, If(rlt_secao = [@'Seção'].'IOS informados', Not(rlt_statusios = [@'Status do IOS'].Concluído || rlt_statusios = [@'Status do IOS'].Cancelado), rlt_status = [@'Status da atividade'].PENDENTE || rlt_status = [@'Status da atividade'].'EM ANDAMENTO')))
